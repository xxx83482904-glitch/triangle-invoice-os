services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: triangle-invoice-os
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads/received-invoices
    restart: unless-stopped
